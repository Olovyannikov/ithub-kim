packages:
  - apps/*
  - packages/*

# pnpm по умолчанию блокирует postinstall-скрипты зависимостей.
# Здесь — явные решения по каждому пакету, который их просит.
# В pnpm 11+ настройка называется allowBuilds (раньше — onlyBuiltDependencies).
allowBuilds:
  # Скачивает нативный бинарник git-хуков.
  lefthook: true
  # Телеметрия, приезжает транзитивно с @nestjs/swagger. Запрещаем осознанно:
  # на площадке ДЭ интернета нет, а отправлять данные о сборке незачем.
  '@scarf/scarf': false
