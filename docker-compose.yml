services:
  postgres:
    image: postgres:17-alpine
    container_name: kim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kim}
      POSTGRES_DB: ${POSTGRES_DB:-conferences}
      # Сортировка и регистр для кириллицы: ФИО и названия помещений в ТЗ на русском.
      POSTGRES_INITDB_ARGS: '--locale=ru_RU.UTF-8 --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kim} -d ${POSTGRES_DB:-conferences}']
      interval: 5s
      timeout: 5s
      retries: 10

  # База для запасного бэкенда на Python (ADR-0011). Поднимается отдельно:
  #   docker compose up -d mysql
  # В перечне ПО из КИМ названа именно MySQL, поэтому план отхода проверяется
  # на ней, а не на PostgreSQL.
  mysql:
    image: mysql:8.4
    container_name: kim-mysql
    restart: unless-stopped
    profiles: ['fallback']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kim}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conferences}
      MYSQL_USER: ${MYSQL_USER:-kim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kim}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-kim}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  mysql-data:
